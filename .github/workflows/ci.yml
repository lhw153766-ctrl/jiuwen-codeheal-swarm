name: CI - Jiuwen-CodeHeal Swarm

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Full Test Suite & Self-Healing Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Unit & E2E Pytest Suite
        run: |
          pytest -v tests --tb=short

      - name: Execute End-to-End Self-Healing Demo
        run: |
          python -m jiuwen_codeheal.cli --demo
