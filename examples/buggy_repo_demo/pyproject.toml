[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buggy_repo_demo"
version = "0.1.0"
description = "待修复示例项目：内置 2 个故意写错的算法/边界 Bug，供 Jiuwen-CodeHeal Swarm 自愈演示。"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["buggy_repo_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
